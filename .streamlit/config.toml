[theme]
base = "light"
primaryColor = "#00a651"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
borderColor = "#e3e3e8"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "14px"
buttonRadius = "full"
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, sans-serif"
linkColor = "#008f45"
greenColor = "#1f9d55"
redColor = "#d64545"
yellowColor = "#d9a21b"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
